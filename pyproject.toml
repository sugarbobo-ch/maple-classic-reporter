[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maple-classic-reporter"
version = "2.0.0-pre"
description = "MapleStory Classic Auto Reporter for Gamania SurveyCake Form"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
    "winsdk>=1.0.0b9",
    "playwright>=1.40.0",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "mss>=9.0.1",
    "opencv-python>=4.8.0.76",
    "opencc-python-reimplemented>=0.1.7",
    "pillow>=10.0.0",
    "pygetwindow>=0.0.9",
    "rapidocr-onnxruntime>=1.3.0",
    "requests>=2.31.0",
    "pyinstaller>=6.3.0",
    "av>=10.0.0",
    "soundcard>=0.4.0",
    "pywebview>=5.0.0",
    "windows-capture>=2.0.1",
    "comtypes>=1.4.9",
]

[project.scripts]
maple-reporter = "maple_reporter.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/maple_reporter"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["node_modules", "web", ".venv", "dist", "build"]

