name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Dependencies & Playwright Browser
        run: |
          uv sync
          uv run playwright install chromium

      - name: Run Unit Tests
        run: |
          uv run python -m unittest discover tests

      - name: Build Standalone Windows Executable
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_windows.ps1

      - name: Package Release ZIP
        shell: powershell
        run: |
          $TAG_NAME = if ("${{ github.ref_name }}" -like "v*") { "${{ github.ref_name }}" } else { "v1.0.0" }
          $ZIP_PATH = "dist/MapleClassicReporter-$TAG_NAME-windows-x64.zip"
          Compress-Archive -LiteralPath "dist/MapleClassicReporter.exe" -DestinationPath $ZIP_PATH -Force
          Write-Host "Created release package: $ZIP_PATH"

      - name: Create GitHub Release & Upload Package
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
