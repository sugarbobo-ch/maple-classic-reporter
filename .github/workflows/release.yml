name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build Windows executable
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Inject release-only OAuth resource
        shell: powershell
        env:
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_OAUTH_CLIENT_JSON)) {
            throw "Missing GOOGLE_OAUTH_CLIENT_JSON repository secret."
          }
          $secretDirectory = Join-Path $env:GITHUB_WORKSPACE "build_secrets"
          New-Item -ItemType Directory -Force -Path $secretDirectory | Out-Null
          $oauthPath = Join-Path $secretDirectory "google_oauth_client.json"
          [System.IO.File]::WriteAllText(
            $oauthPath,
            $env:GOOGLE_OAUTH_CLIENT_JSON,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Install Playwright Chromium
        run: uv run playwright install chromium

      - name: Run unit tests
        run: uv run python -m unittest discover tests

      - name: Build standalone Windows executable
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build_windows.ps1

      - name: Package release ZIP
        shell: powershell
        run: |
          $tagName = if ("${{ github.ref_name }}" -like "v*") { "${{ github.ref_name }}" } else { "v1.0.0" }
          $zipPath = "dist/MapleClassicReporter-$tagName-windows-x64.zip"
          Compress-Archive -LiteralPath "dist/MapleClassicReporter.exe" -DestinationPath $zipPath -Force
          Write-Host "Created release package: $zipPath"

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: MapleClassicReporter-windows-x64
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: MapleClassicReporter-windows-x64
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
