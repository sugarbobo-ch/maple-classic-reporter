name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build Windows executable
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "web/pnpm-lock.yaml"

      - name: Install locked Python dependencies
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync uv environment
        run: uv sync --frozen

      - name: Inject release-only OAuth resource
        shell: powershell
        env:
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_OAUTH_CLIENT_JSON)) {
            throw "Missing GOOGLE_OAUTH_CLIENT_JSON repository secret."
          }
          $secretDirectory = Join-Path $env:GITHUB_WORKSPACE "build_secrets"
          New-Item -ItemType Directory -Force -Path $secretDirectory | Out-Null
          $oauthPath = Join-Path $secretDirectory "google_oauth_client.json"
          [System.IO.File]::WriteAllText(
            $oauthPath,
            $env:GOOGLE_OAUTH_CLIENT_JSON,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Install Playwright Chromium
        run: uv run playwright install chromium

      - name: Run unit tests
        run: uv run python -m unittest discover tests

      - name: Build standalone Windows executable
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build_windows.ps1

      - name: Verify standalone bundle
        run: uv run python scripts/verify_release_bundle.py --bundle-dir dist/MapleClassicReporter --launch-smoke

      - name: Package release ZIP
        shell: powershell
        run: |
          $versionLine = Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"'
          $projectVersion = $versionLine.Matches[0].Groups[1].Value
          $tagName = if ("${{ github.ref_name }}" -like "v*") { "${{ github.ref_name }}" } else { "v$projectVersion" }
          $bundlePath = "dist/MapleClassicReporter"
          $exePath = Join-Path $bundlePath "MapleClassicReporter.exe"
          if (-not (Test-Path -LiteralPath $exePath -PathType Leaf)) {
            throw "Missing onedir executable: $exePath"
          }
          $zipPath = "dist/MapleClassicReporter-$tagName-windows-x64.zip"
          tar.exe -a -cf "$zipPath" -C dist MapleClassicReporter
          if (-not (Test-Path -LiteralPath $zipPath)) {
            Compress-Archive -LiteralPath $bundlePath -DestinationPath $zipPath -CompressionLevel Optimal -Force
          }
          Write-Host "Created release package: $zipPath"

      - name: Build update manifests and delta package
        shell: powershell
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $versionLine = Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"'
          $projectVersion = $versionLine.Matches[0].Groups[1].Value
          $tagName = if ("${{ github.ref_name }}" -like "v*") { "${{ github.ref_name }}" } else { "v$projectVersion" }
          $isPrerelease = $tagName -match '-'
          $headers = @{ Accept = 'application/vnd.github+json'; 'User-Agent' = 'MapleClassicReporter-release'; Authorization = "Bearer $env:GITHUB_TOKEN" }
          $previousVersion = $null
          $previousManifest = $null
          $previousBundle = $null
          if ($projectVersion -ne '2.0.0') {
            $releases = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/sugarbobo-ch/maple-classic-reporter/releases?per_page=30'
            $previous = $releases | Where-Object { $_.tag_name -ne $tagName -and ([bool]$_.prerelease -eq $isPrerelease) } | Select-Object -First 1
            if ($previous) {
              $previousVersion = $previous.tag_name.TrimStart('v')
              $manifestAsset = $previous.assets | Where-Object { $_.name -eq 'bundle-manifest-v1.json' } | Select-Object -First 1
              if ($manifestAsset) {
                $manifestPath = Join-Path $env:GITHUB_WORKSPACE 'dist\previous-bundle-manifest.json'
                curl.exe -sL -H "Authorization: Bearer $env:GITHUB_TOKEN" $manifestAsset.browser_download_url -o $manifestPath
                if (Test-Path -LiteralPath $manifestPath) {
                  $previousManifest = $manifestPath
                  Write-Host "Downloaded previous bundle manifest for v$previousVersion"
                }
              }
              if (-not $previousManifest) {
                $previousZip = $previous.assets | Where-Object { $_.name -like '*-windows-x64.zip' -and $_.name -notlike '*.patch.zip' } | Select-Object -First 1
                if ($previousZip) {
                  $previousArchive = Join-Path $env:GITHUB_WORKSPACE 'dist\previous-release.zip'
                  curl.exe -sL -H "Authorization: Bearer $env:GITHUB_TOKEN" $previousZip.browser_download_url -o $previousArchive
                  $previousExtract = Join-Path $env:GITHUB_WORKSPACE 'dist\previous-release'
                  New-Item -ItemType Directory -Force -Path $previousExtract | Out-Null
                  tar.exe -xf $previousArchive -C $previousExtract
                  $candidate1 = Join-Path $previousExtract 'MapleClassicReporter'
                  if (Test-Path -LiteralPath (Join-Path $candidate1 'MapleClassicReporter.exe')) {
                    $previousBundle = $candidate1
                  } elseif (Test-Path -LiteralPath (Join-Path $previousExtract 'MapleClassicReporter.exe')) {
                    $previousBundle = $previousExtract
                  }
                  if ($previousBundle) {
                    Write-Host "Extracted previous release bundle for v$previousVersion"
                  }
                }
              }
            }
          }
          $arguments = @(
            'scripts/build_update_assets.py',
            '--bundle-dir', 'dist/MapleClassicReporter',
            '--output-dir', 'dist/update-assets',
            '--version', $projectVersion,
            '--full-zip', "dist/MapleClassicReporter-$tagName-windows-x64.zip"
          )
          if ($previousManifest -and (Test-Path -LiteralPath $previousManifest)) {
            $arguments += @('--previous-manifest', $previousManifest, '--previous-version', $previousVersion)
          } elseif ($previousBundle -and (Test-Path -LiteralPath $previousBundle)) {
            $arguments += @('--previous-bundle', $previousBundle, '--previous-version', $previousVersion)
          }
          & uv run python @arguments
          if ($LASTEXITCODE -ne 0) { throw "Update asset generation failed with exit code $LASTEXITCODE." }
          $checksumFiles = @(
            Get-ChildItem -LiteralPath 'dist' -Filter '*.zip' -File
            Get-ChildItem -LiteralPath 'dist/update-assets' -File
          ) | Sort-Object Name
          if (-not $checksumFiles) { throw "No release assets were generated for SHA256SUMS.txt." }
          $checksumLines = foreach ($asset in $checksumFiles) {
            $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($asset.Name)"
          }
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllLines(
            (Join-Path $env:GITHUB_WORKSPACE 'dist/update-assets/SHA256SUMS.txt'),
            $checksumLines,
            $utf8NoBom
          )
          Remove-Item -LiteralPath 'dist/previous-release.zip' -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath 'dist/previous-release' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath 'dist/previous-bundle-manifest.json' -Force -ErrorAction SilentlyContinue

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: MapleClassicReporter-windows-x64
          path: |
            dist/*.zip
            dist/update-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: MapleClassicReporter-windows-x64
          path: dist

      - name: Select release notes
        id: release-notes
        shell: bash
        run: |
          notes_path="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "$notes_path" ]]; then
            echo "has_custom_notes=true" >> "$GITHUB_OUTPUT"
            echo "notes_path=$notes_path" >> "$GITHUB_OUTPUT"
          else
            echo "has_custom_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release with project notes
        if: steps.release-notes.outputs.has_custom_notes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/update-assets/*
          body_path: ${{ steps.release-notes.outputs.notes_path }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false

      - name: Create GitHub release with generated notes
        if: steps.release-notes.outputs.has_custom_notes != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/update-assets/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
